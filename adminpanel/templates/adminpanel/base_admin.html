<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Admin Control Center | LocalTask AI{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --admin-bg: #f4f7f6;
            --sidebar-dark: #064e3b;      /* Deep Forest */
            --accent-emerald: #10b981;    /* Emerald Green */
            --danger-soft: #fff1f2;
            --danger-main: #e11d48;
            --sidebar-width: 280px;
            --header-height: 80px;
            --glass-white: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--admin-bg);
            color: #1e293b;
            margin: 0;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        /* --- PREMIUM SIDEBAR --- */
        .admin-sidebar {
            width: var(--sidebar-width);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1050;
            background: var(--sidebar-dark);
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .brand-section {
            padding: 35px 30px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
        }

        .brand-section i {
            filter: drop-shadow(0 0 8px var(--accent-emerald));
        }

        .nav-group {
            padding: 30px 18px;
            flex: 1;
            list-style: none;
        }

        .admin-nav-link {
            color: rgba(209, 250, 229, 0.6);
            padding: 14px 20px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 14px;
        }

        .admin-nav-link i { 
            font-size: 1.3rem; 
            margin-right: 15px; 
            opacity: 0.7;
        }

        .admin-nav-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }

        .admin-nav-link.active {
            color: #ffffff;
            background: var(--accent-emerald);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.25);
        }

        .admin-nav-link.active i { opacity: 1; }

        /* Report Center Special Styling */
        .report-link.active {
            background: var(--danger-main) !important;
            box-shadow: 0 12px 24px rgba(225, 29, 72, 0.25) !important;
        }

        /* --- GLASS HEADER --- */
        .admin-main {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            padding: 0 45px;
            height: var(--header-height);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--accent-emerald);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- USER DROPDOWN --- */
        .admin-profile-btn {
            background: #ffffff;
            border: 1px solid #edf2f7 !important;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--sidebar-dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s;
        }

        .admin-profile-btn:hover {
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        /* --- CONTENT BODY --- */
        .content-body {
            padding: 45px;
            flex: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FOOTER --- */
        .admin-footer {
            padding: 25px 45px;
            background: white;
            border-top: 1px solid rgba(0,0,0,0.05);
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<aside class="admin-sidebar">
    <div class="brand-section text-white">
        <i class="bi bi-cpu-fill me-3" style="color: var(--accent-emerald);"></i> 
        <span>LocalTask <span style="color: var(--accent-emerald)">AI</span></span>
    </div>
    
    <div class="nav-group">
        <a href="{% url 'admin_dashboard' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
            <i class="bi bi-intersect"></i> Overview
        </a>

        <a href="{% url 'admin_user_management' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'admin_user_management' %}active{% endif %}">
            <i class="bi bi-person-vcard-fill"></i> User Directory
        </a>

        <a href="{% url 'admin_task_management' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'admin_task_management' %}active{% endif %}">
            <i class="bi bi-stack"></i> Task Infrastructure
        </a>

        <a href="{% url 'location_management' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'location_management' %}active{% endif %}">
            <i class="bi bi-geo-fill"></i> Location Hub
        </a>

        <a href="{% url 'skill_management' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'skill_management' %}active{% endif %}">
            <i class="bi bi-terminal-fill"></i> Skill Taxonomy
        </a>

        <div class="mt-4 pt-4 border-top border-secondary border-opacity-25">
            <a href="{% url 'admin_report_center' %}" class="admin-nav-link report-link {% if request.resolver_match.url_name == 'admin_report_center' %}active{% endif %}">
                <i class="bi bi-shield-lock-fill"></i> Security Center
            </a>
        </div>
    </div>
</aside>

<main class="admin-main">
    <header class="admin-header">
        <div class="system-summary d-flex flex-column">
            <div class="system-status">
                <div class="status-dot"></div>
                <span class="text-dark">Cloud Environment Active</span>
            </div>
            <span class="text-muted smaller fw-600" style="font-size: 0.75rem;">Node ID: LT-AI-CORE-01</span>
        </div>

        <div class="d-flex align-items-center gap-3">
            <div class="dropdown">
                <button class="admin-profile-btn d-flex align-items-center gap-2 border-0" data-bs-toggle="dropdown">
                    <img src="https://ui-avatars.com/api/?name={{ user.name }}&background=064e3b&color=fff" class="rounded-circle" width="28">
                    <span>{{ user.name }}</span>
                    <i class="bi bi-chevron-down small opacity-50"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-3 p-2 rounded-4">
                    <li class="px-3 py-2 small text-muted">Signed in as <b>Admin</b></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger rounded-3 fw-bold" href="{% url 'logout_user' %}">
                        <i class="bi bi-power me-2"></i> Terminate Session
                    </a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="content-body">
        {% block content %}{% endblock %}
    </div>

    <footer class="admin-footer">
        &copy; 2026 LocalTask AI Neural Network | Intelligent Service Management
    </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
