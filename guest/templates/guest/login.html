{% extends 'guest/base_guest.html' %}
{% block content %}
<style>
    /* 1. Reset body and ensure it takes full height */
    body { background: #f8fafc; min-height: 100vh; }
    
    /* 2. Professional Centering Wrapper */
    .auth-wrapper {
        /* This calculates height minus nav/footer and adds healthy padding */
        min-height: calc(100vh - 180px); 
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px; /* Ensures space from top/bottom on mobile */
    }

    .login-card { 
        background: white; 
        padding: 50px; /* More internal air */
        border-radius: 30px; 
        width: 100%; 
        max-width: 420px; 
        border: none;
        box-shadow: 0 20px 40px rgba(0,0,0,0.06); /* Softer, wider shadow */
    }
    
    .btn-login { 
        background: #10b981; 
        color: white; 
        border: none; 
        padding: 14px; 
        border-radius: 12px; 
        font-weight: 700; 
        width: 100%; 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        margin-top: 10px;
    }
    
    .btn-login:hover { 
        background: #059669; 
        transform: translateY(-2px); 
        box-shadow: 0 8px 15px rgba(16, 185, 129, 0.2);
    }
    
    .form-control { 
        border-radius: 12px; 
        padding: 14px; 
        border: 1.5px solid #f1f5f9; 
        background-color: #f8fafc;
        transition: 0.2s;
    }

    .form-control:focus {
        background-color: #fff;
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        outline: none;
    }

    .form-label {
        letter-spacing: 0.05em;
        margin-bottom: 8px;
    }
</style>

<div class="auth-wrapper">
    <div class="login-card">
        <h2 class="text-center fw-extrabold mb-5" style="color: #0f172a; letter-spacing: -1px;">Sign In</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger border-0 small text-center mb-4" style="border-radius: 12px; background-color: #fef2f2; color: #991b1b;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-bold small text-muted">EMAIL ADDRESS</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
            
            <div class="mb-2">
                <label class="form-label fw-bold small text-muted">PASSWORD</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <div class="text-end mb-4">
                <a href="{% url 'forgot_password' %}" class="small text-decoration-none fw-bold" style="color: #10b981;">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-login shadow-sm">Login to Account</button>
            
            <div class="text-center mt-5 pt-4 border-top">
                <p class="small text-muted mb-0">
                    Don't have an account? 
                    <a href="{% url 'register' %}" class="fw-bold text-decoration-none" style="color: #10b981;">Create Account</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
