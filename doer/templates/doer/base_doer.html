<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Doer Hub | LocalTask AI{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            /* BLUE THEME GRADIENTS */
            --main-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --user-gradient: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            --blue-accent: #3b82f6;
            --soft-bg: #f8fafc;
        }

        body {
            background-color: var(--soft-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* --- VIBRANT NAVIGATION --- */
        .doer-nav {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            border-bottom: 3px solid var(--blue-accent);
            padding: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            z-index: 1050;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 85px;
        }

        /* --- DESIGNED LOGO (Blue Variant) --- */
        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--main-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
            transform: rotate(-5deg);
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.2rem;
            color: #1e3a8a;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        /* --- NAV LINKS --- */
        .nav-links-list {
            display: flex;
            gap: 5px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links-list a {
            text-decoration: none;
            color: #475569;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s;
        }

        .nav-links-list a i { font-size: 1.2rem; margin-bottom: 3px; }
        
        /* Icon Colors */
        .i-dash { color: #3b82f6; }
        .i-find { color: #f59e0b; }
        .i-apps { color: #8b5cf6; }
        .i-msg { color: #06b6d4; }
        .i-hired { color: #10b981; }
        .i-pref { color: #f97316; }
        .i-prof { color: #6366f1; }
        .i-verify { color: #1e3a8a; }

        .nav-links-list a:hover {
            background: #f1f5f9;
            transform: translateY(-3px);
            color: var(--blue-accent);
        }

        .nav-links-list a.active-link {
            background: #eff6ff;
            color: var(--blue-accent);
        }

        /* --- USER ZONE --- */
        .user-zone {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--user-gradient);
            padding: 8px 8px 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .user-meta {
            text-align: right;
            line-height: 1.2;
        }

        .logout-btn {
            width: 42px;
            height: 42px;
            background: white;
            color: #be123c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .logout-btn:hover {
            background: #be123c;
            color: white;
            transform: scale(1.1) rotate(10deg);
        }

        .main-wrapper { flex: 1; padding: 2.5rem 0; }
        footer { background: #1e3a8a; color: white; padding: 2.5rem 0; text-align: center; }
        
        .invites-btn {
            background: white !important;
            border: 1px solid var(--blue-accent) !important;
            color: var(--blue-accent) !important;
        }
    </style>
</head>
<body>

    <nav class="doer-nav sticky-top">
        <div class="container nav-container">
            <a href="{% url 'doer_home' %}" class="logo-box">
                <div class="logo-icon">
                    <i class="bi bi-robot"></i>
                </div>
                <div class="logo-text">
                    LocalTask<br><span style="color: var(--blue-accent)">AI</span>
                </div>
            </a>
            
            <ul class="nav-links-list">
                <li><a href="{% url 'doer_home' %}" class="{% if request.resolver_match.url_name == 'doer_home' %}active-link{% endif %}"><i class="bi bi-grid-1x2-fill i-dash"></i>Dashboard</a></li>
                <li><a href="{% url 'doer_task_feed' %}" class="{% if request.resolver_match.url_name == 'doer_task_feed' %}active-link{% endif %}"><i class="bi bi-search i-find"></i>Find Work</a></li>
                <li><a href="{% url 'my_requests' %}" class="{% if request.resolver_match.url_name == 'my_requests' %}active-link{% endif %}"><i class="bi bi-send-check-fill i-apps"></i>Applications</a></li>
                <li><a href="{% url 'doer_hired_jobs' %}" class="{% if request.resolver_match.url_name == 'doer_hired_jobs' %}active-link{% endif %}"><i class="bi bi-briefcase-fill i-hired"></i>Hired</a></li>
                <li><a href="{% url 'doer_chat_inbox' %}" class="{% if 'messages' in request.path %}active-link{% endif %}"><i class="bi bi-chat-dots-fill i-msg"></i>Messages</a></li>
                <li><a href="{% url 'manage_preferences' user.id %}"><i class="bi bi-sliders i-pref"></i>Preferences</a></li>
                <li><a href="{% url 'doer_profile_view' %}"><i class="bi bi-person-badge-fill i-prof"></i>Profile</a></li>
                <li><a href="{% url 'verification_badge' %}"><i class="bi bi-patch-check-fill i-verify"></i>Security</a></li>
                
                <li>
                    <a href="{% url 'doer_job_requests' %}" class="invites-btn">
                        <i class="bi bi-envelope-check-fill"></i>Invites
                        {% if pending_req_count > 0 %}
                        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                        {% endif %}
                    </a>
                </li>
            </ul>

            <div class="user-zone">
                <div class="user-meta d-none d-xl-block">
                    <div class="fw-bold text-dark small">{{ user.username }}</div>
                    <div style="font-size: 0.6rem; font-weight: 800; color: var(--blue-accent);">SKILLED TALENT</div>
                </div>
                <a href="{% url 'logout_user' %}" class="logout-btn" title="Sign Out">
                    <i class="bi bi-power"></i>
                </a>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p class="small opacity-75 mb-0">&copy; 2026 LocalTask AI | Smart Local Service Platform</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
